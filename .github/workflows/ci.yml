name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Generated files are committed
        run: |
          bun run generate
          git diff --exit-code
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo "::error::bun run generate wrote files that are not committed"
            echo "$untracked"
            exit 1
          fi
      - name: Type check and lint
        run: bun run typecheck
      - run: bun run format:check
      - run: bun run test
      - name: Spec parity
        run: bun run parity
      - name: HTTP smoke test
        run: bun run smoke
      - name: Client type check and tests
        run: bun run client:check
      - name: Client build
        run: bun run client:build
